name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Types and Astro templates.
      - run: npm run check

      # Unit tests: i18n routing, cookies, structured data, edge worker, geometry.
      - run: npm test

      # Unused files, exports and dependencies.
      - run: npm run lint:unused

      - run: npm run build

      # Built output: links, anchors, h1, canonical, hreflang, HTML size budget.
      - run: npm run verify
